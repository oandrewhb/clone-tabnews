name: Linting
on: pull_request
jobs:
  style:
    name: Style (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/hydrogen
      - run: npm ci
      - run: npm run lint:style:check
  quality:
    name: Quality (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/hydrogen
      - run: npm ci
      - run: npm run lint:quality:check
